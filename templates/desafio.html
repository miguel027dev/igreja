{% extends "base.html" %}
{% block title %}Desafio | {{ aula.titulo }}{% endblock %}
{% block extra_css %}
<style>
    .quiz-page { max-width: 700px; margin: 0 auto; padding: 20px 4% 100px; }
    .quiz-header { text-align: center; margin-bottom: 30px; }
    .quiz-header h1 { font-size: 1.3rem; font-weight: 800; margin-bottom: 5px; }
    .quiz-header p { color: var(--text-sec); font-size: 0.85rem; }
    .progress-bar { height: 6px; background: var(--glass-border); border-radius: 10px; overflow: hidden; margin-bottom: 25px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--secondary), var(--primary)); transition: width 0.4s ease; border-radius: 10px; }

    .question-card {
        background: var(--bg-card); border: 1px solid var(--glass-border);
        border-radius: var(--radius-lg); padding: 25px; margin-bottom: 20px;
        animation: fadeInUp 0.4s ease;
    }
    .question-number { font-size: 0.65rem; font-weight: 800; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .question-text { font-size: 1.05rem; font-weight: 700; margin-bottom: 20px; line-height: 1.4; }

    .option {
        display: flex; align-items: center; gap: 12px;
        padding: 14px 16px; margin-bottom: 10px;
        background: rgba(255,255,255,0.02); border: 2px solid var(--glass-border);
        border-radius: var(--radius-sm); cursor: pointer;
        transition: 0.25s; font-size: 0.9rem;
    }
    .option:hover { border-color: var(--secondary); background: rgba(0, 156, 224, 0.05); }
    .option.selected { border-color: var(--primary); background: rgba(212, 225, 23, 0.08); }
    .option.correct { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
    .option.wrong { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
    .option-letter {
        min-width: 28px; height: 28px; border-radius: 8px;
        background: var(--glass-border); display: flex;
        align-items: center; justify-content: center;
        font-size: 0.7rem; font-weight: 800; flex-shrink: 0;
    }
    .option.selected .option-letter { background: var(--primary); color: var(--bg-deep); }
    .option.correct .option-letter { background: var(--success); color: #fff; }
    .option.wrong .option-letter { background: var(--danger); color: #fff; }

    .quiz-nav { display: flex; justify-content: space-between; margin-top: 25px; }
    .btn-quiz-nav { padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.85rem; cursor: pointer; border: none; transition: 0.3s; }
    .btn-prev { background: var(--glass-border); color: var(--text-sec); }
    .btn-prev:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .btn-next { background: var(--secondary); color: #fff; }
    .btn-next:hover { filter: brightness(1.1); transform: translateY(-2px); }
    .btn-finish { background: var(--primary); color: var(--bg-deep); }
    .btn-finish:hover { filter: brightness(1.1); transform: translateY(-2px); }

    /* Result Screen */
    .result-screen { text-align: center; padding: 40px 20px; animation: fadeInUp 0.6s ease; }
    .score-circle {
        width: 140px; height: 140px; margin: 0 auto 30px;
        border-radius: 50%; border: 4px solid var(--primary);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        box-shadow: 0 0 40px rgba(212, 225, 23, 0.15); background: rgba(212, 225, 23, 0.03);
    }
    .score-value { font-size: 2.8rem; font-weight: 900; line-height: 1; }
    .score-label { font-size: 0.65rem; font-weight: 800; letter-spacing: 2px; color: var(--primary); text-transform: uppercase; margin-top: 4px; }
    .result-screen h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
    .result-screen p { color: var(--text-sec); margin-bottom: 25px; }
    .xp-won {
        display: inline-flex; align-items: center; gap: 8px;
        background: rgba(212, 225, 23, 0.1); border: 1px solid var(--glass-border);
        padding: 10px 24px; border-radius: 100px; font-weight: 700; color: var(--primary);
        margin-bottom: 30px; animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(212, 225, 23, 0.2); }
        70% { box-shadow: 0 0 0 12px rgba(212, 225, 23, 0); }
        100% { box-shadow: 0 0 0 0 rgba(212, 225, 23, 0); }
    }
</style>
{% endblock %}
{% block content %}
<div class="quiz-page">
    <div class="quiz-header">
        <span class="badge-cat">{{ aula.categoria }}</span>
        <h1>{{ aula.titulo }}</h1>
        <p>Desafio de Verificação de Conhecimento</p>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>

    <div id="quizContainer"></div>
    <div id="resultContainer" style="display: none;"></div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
const quizData = {{ aula.quiz_data | tojson }};
let currentQ = 0;
let answers = [];
let score = 0;

function renderQuestion() {
    const q = quizData[currentQ];
    const container = document.getElementById('quizContainer');
    const progress = ((currentQ) / quizData.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';

    const letters = ['A', 'B', 'C', 'D'];
    const optionsHtml = q.opcoes.map((opt, i) => `
        <div class="option" onclick="selectOption(${i})">
            <div class="option-letter">${letters[i]}</div>
            <span>${opt}</span>
        </div>
    `).join('');

    container.innerHTML = `
        <div class="question-card">
            <div class="question-number">Questão ${currentQ + 1} de ${quizData.length}</div>
            <div class="question-text">${q.pergunta}</div>
            <div class="options">${optionsHtml}</div>
            <div class="quiz-nav">
                <button class="btn-quiz-nav btn-prev" ${currentQ === 0 ? 'disabled style="opacity:0.4"' : ''} onclick="prevQ()">
                    <i class="fa-solid fa-arrow-left"></i> Anterior
                </button>
                <button class="btn-quiz-nav btn-next" id="nextBtn" onclick="nextQ()" disabled>
                    ${currentQ === quizData.length - 1 ? 'Finalizar <i class="fa-solid fa-check"></i>' : 'Próxima <i class="fa-solid fa-arrow-right"></i>'}
                </button>
            </div>
        </div>
    `;
}

function selectOption(idx) {
    document.querySelectorAll('.option').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
    });
    answers[currentQ] = idx;
    document.getElementById('nextBtn').disabled = false;
}

function nextQ() {
    if (currentQ < quizData.length - 1) {
        currentQ++;
        renderQuestion();
    } else {
        finishQuiz();
    }
}

function prevQ() {
    if (currentQ > 0) {
        currentQ--;
        renderQuestion();
        if (answers[currentQ] !== undefined) {
            document.querySelectorAll('.option')[answers[currentQ]].classList.add('selected');
            document.getElementById('nextBtn').disabled = false;
        }
    }
}

function finishQuiz() {
    score = 0;
    quizData.forEach((q, i) => {
        if (answers[i] === q.correta) score++;
    });
    const percentage = Math.round((score / quizData.length) * 100);
    const passed = percentage >= 60;

    document.getElementById('quizContainer').style.display = 'none';
    document.getElementById('progressFill').style.width = '100%';

    const resultHtml = `
        <div class="result-screen">
            <div class="score-circle">
                <span class="score-value">${score}/${quizData.length}</span>
                <span class="score-label">Acertos</span>
            </div>
            <h2>${passed ? 'Excelente!' : 'Continue Estudando!'}</h2>
            <p>${passed ? 'Você demonstrou ótimo conhecimento neste módulo.' : 'Revise o conteúdo e tente novamente para melhorar sua nota.'}</p>
            ${passed ? `<div class="xp-won"><i class="fa-solid fa-bolt"></i> +{{ aula.xp_recompensa }} XP CONQUISTADO</div>` : ''}
            <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
                <a href="{{ url_for('ver_aula', slug=aula.slug) }}" class="btn btn-ghost">
                    <i class="fa-solid fa-arrow-left"></i> Voltar à Aula
                </a>
                <a href="{{ url_for('lista_aulas') }}" class="btn btn-primary">
                    <i class="fa-solid fa-book-bible"></i> Biblioteca
                </a>
            </div>
        </div>
    `;
    document.getElementById('resultContainer').innerHTML = resultHtml;
    document.getElementById('resultContainer').style.display = 'block';

    if (passed) {
        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 }, colors: ['#d4e117', '#009ce0', '#ffffff'] });
    }

    // Salvar no servidor
    fetch('/api/aulas/concluir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ aula_id: {{ aula.id }}, nota: score / quizData.length })
    });
}

renderQuestion();
</script>
{% endblock %}
